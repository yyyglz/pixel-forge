spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pixelforge?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:pixel}
    password: ${DB_PASSWORD:pixel_dev}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: 8080
pixel:
  storage: ${STORAGE_PATH:./storage}
  simulation-enabled: ${SIMULATION_ENABLED:true}
  core-threads: ${TASK_CORE_THREADS:2}
  max-threads: ${TASK_MAX_THREADS:4}
  queue-capacity: ${TASK_QUEUE_CAPACITY:20}
