services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pixelforge}
      MYSQL_USER: ${MYSQL_USER:-pixel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pixel_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pixelforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${MYSQL_USER:-pixel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pixel_dev}
      STORAGE_PATH: /data
      SIMULATION_ENABLED: "true"
    volumes:
      - media_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  mysql_data:
  media_data:
